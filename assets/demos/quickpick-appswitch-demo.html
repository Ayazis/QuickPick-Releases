<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickPick — hex menu demo (active apps &amp; app switching)</title>
<!-- QuickPick hex-menu landing-page demo: active apps.
     Shows the pinned-app bar with running apps (underlined), hovering an
     app icon to get a live window thumbnail (with peek), and clicking the
     thumbnail to switch to that app. Built on the shared qp-core engine —
     see qp-core.js/qp-core.css/qp-icons.js plus the qp-appbar and
     qp-thumbnail add-ons. The two "app windows" are styled placeholders
     standing in for real desktop windows. -->
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0d; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  /* ── Placeholder desktop windows — Windows 11 chrome ─────────── */
  .qp-fakewin {
    position: absolute;
    width: 212px; height: 134px;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid #3a3a40;
    background: #202024;
    box-shadow: 0 14px 34px rgba(0, 0, 0, .55);
    transition: filter .45s, opacity .3s, transform .45s;
  }
  .qp-fakewin.front { z-index: 2; }
  .qp-fakewin.back  { z-index: 1; filter: brightness(.5) saturate(.75); }
  /* Aero-peek while hovering a thumbnail: peeked window comes forward,
     every other window is hidden entirely (matches ActivatePeek, which
     only shows the peeked window's live thumbnail on the desktop) */
  .qp-stage.peek .qp-fakewin:not(.peeked) { opacity: 0; }
  .qp-stage.peek .qp-fakewin.peeked { filter: none; }

  /* The same window markup, statically sized, reused inside thumbnails */
  .qp-fakewin-static { position: relative; width: 212px; height: 134px; background: #202024; }
  .qp-shot-scale { width: 212px; height: 134px; transform: scale(.548); transform-origin: 0 0; }

  /* Win11 title bar: app icon + title on the left, caption buttons right */
  .qp-fw-bar {
    height: 24px;
    background: #2b2b31;
    display: flex; align-items: center;
  }
  .qp-fw-appicon { display: flex; margin-left: 8px; }
  .qp-fw-appicon svg { width: 13px; height: 13px; }
  .qp-fw-title {
    flex: 1;
    font-size: 8.5px; color: #cdcdd4;
    margin-left: 7px; padding-right: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .qp-fw-caption { display: flex; align-self: stretch; }
  .qp-fw-cap { width: 22px; display: flex; align-items: center; justify-content: center; }
  .qp-fw-cap svg { width: 8px; height: 8px; }
  .qp-fw-cap line, .qp-fw-cap rect {
    stroke: #cdcdd4; stroke-width: 1; fill: none;
    stroke-linecap: square;
  }
  .qp-fw-body { position: relative; height: calc(100% - 24px); }

  /* browser placeholder */
  .fwb-browser { background: #232327; padding: 8px 10px; box-sizing: border-box; }
  .fw-addr { height: 9px; border-radius: 5px; background: #35353b; margin-bottom: 8px; }
  .fw-hero { height: 40px; border-radius: 4px; background: linear-gradient(120deg, #0F7D80 0%, #149EA3 100%); opacity: .85; margin-bottom: 8px; }
  .fw-line { height: 5px; border-radius: 3px; background: #3d3d44; margin-bottom: 6px; }

  /* code-editor placeholder */
  .fwb-editor { background: #1b1b20; display: flex; }
  .fw-side { width: 26px; background: #232329; }
  .fw-code { flex: 1; padding: 9px 10px; }
  .fw-code div { height: 5px; border-radius: 3px; margin-bottom: 7px; opacity: .75; }

  /* keep QuickPick above the placeholder windows */
  .qp-demo .qp-window { z-index: 5; }
</style>
<link rel="stylesheet" href="qp-core.css">
<link rel="stylesheet" href="qp-appbar.css">
<link rel="stylesheet" href="qp-thumbnail.css">
</head>
<body>

<div class="qp-demo" id="qpDemo"></div>

<script src="qp-icons.js" defer></script>
<script src="qp-core.js" defer></script>
<script src="qp-appbar.js" defer></script>
<script src="qp-thumbnail.js" defer></script>
<script defer>
document.addEventListener("DOMContentLoaded", function () {
(function () {
  "use strict";

  /* ── App icons (20x20, for the app bar and thumbnail titles) ── */
  var appIcons = {
    editor: QpAppBar.svgIcon(
      '<rect x="3" y="4" width="14" height="12" rx="2" fill="#7c5cff"/>' +
      '<path d="M7.5 8 5.5 10l2 2M12.5 8l2 2-2 2" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'),
    browser: QpAppBar.svgIcon(
      '<circle cx="10" cy="10" r="7" fill="#2f9df4"/>' +
      '<ellipse cx="10" cy="10" rx="3" ry="7" fill="none" stroke="#d9f0ff" stroke-width="1"/>' +
      '<path d="M3.4 8h13.2M3.4 12h13.2" stroke="#d9f0ff" stroke-width="1" fill="none"/>'),
    mail: QpAppBar.svgIcon(
      '<rect x="3" y="5" width="14" height="10" rx="1.5" fill="#e5b53a"/>' +
      '<path d="M3.5 6l6.5 5 6.5-5" stroke="#7a5c12" stroke-width="1.2" fill="none"/>'),
    music: QpAppBar.svgIcon(
      '<path d="M8 15.5V6l7-1.8v9.3" stroke="#4ccf7a" stroke-width="1.6" fill="none"/>' +
      '<circle cx="6.3" cy="15.5" r="2" fill="#4ccf7a"/><circle cx="14.8" cy="13.5" r="2" fill="#4ccf7a"/>')
  };

  /* ── Placeholder window contents (shared by desktop + thumbnails) ── */
  var captionBtns =
    '<div class="qp-fw-caption">' +
      '<span class="qp-fw-cap"><svg viewBox="0 0 10 10"><line x1="1.5" y1="5" x2="8.5" y2="5"/></svg></span>' +
      '<span class="qp-fw-cap"><svg viewBox="0 0 10 10"><rect x="1.8" y="1.8" width="6.4" height="6.4"/></svg></span>' +
      '<span class="qp-fw-cap close"><svg viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg></span>' +
    '</div>';
  function barHTML(iconSvg, title) {
    return '<div class="qp-fw-bar">' +
      '<span class="qp-fw-appicon">' + iconSvg + '</span>' +
      '<span class="qp-fw-title">' + title + '</span>' +
      captionBtns + '</div>';
  }
  var browserInner = barHTML(appIcons.browser, "QuickPick Docs") +
    '<div class="qp-fw-body fwb-browser">' +
      '<div class="fw-addr"></div><div class="fw-hero"></div>' +
      '<div class="fw-line" style="width:72%"></div>' +
      '<div class="fw-line" style="width:55%"></div>' +
      '<div class="fw-line" style="width:64%"></div>' +
    '</div>';
  var editorInner = barHTML(appIcons.editor, "main.js") +
    '<div class="qp-fw-body fwb-editor"><div class="fw-side"></div><div class="fw-code">' +
      '<div style="width:45%;background:#7c5cff"></div>' +
      '<div style="width:70%;background:#4ccf7a;margin-left:12px"></div>' +
      '<div style="width:58%;background:#e5b53a;margin-left:12px"></div>' +
      '<div style="width:36%;background:#56b6c2;margin-left:24px"></div>' +
      '<div style="width:64%;background:#8a8a92;margin-left:12px"></div>' +
      '<div style="width:28%;background:#7c5cff"></div>' +
    '</div></div>';

  function thumbShot(inner) {
    return '<div class="qp-shot-scale"><div class="qp-fakewin-static">' + inner + '</div></div>';
  }
  var thumbData = [
    { icon: appIcons.editor, title: "main.js — Code Editor", shot: thumbShot(editorInner) },
    { icon: appIcons.browser, title: "QuickPick Docs — Browser", shot: thumbShot(browserInner) }
  ];

  /* ── Engine instance: hex menu + app bar (running apps underlined) ── */
  var bindings = ["tools", "minimize", "forward", "play", "backward", "volume", "adjust"];
  var qp = QuickPickHex.create(document.getElementById("qpDemo"), {
    bindings: bindings,
    icons: QpIcons,
    stageWidth: 380,
    stageHeight: 370,
    appBar: { apps: [
      { run: true, icon: appIcons.editor },
      { run: true, icon: appIcons.browser },
      { run: false, icon: appIcons.mail },
      { run: false, icon: appIcons.music }
    ] }
  });

  /* ── Two placeholder desktop windows behind QuickPick ── */
  function makeWin(x, y, inner, focusClass) {
    var el = document.createElement("div");
    el.className = "qp-fakewin " + focusClass;
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.innerHTML = inner;
    qp.stage.insertBefore(el, qp.stage.firstChild);
    return el;
  }
  var winBrowser = makeWin(20, 45, browserInner, "back");
  var winEditor = makeWin(148, 95, editorInner, "front");

  function focus(winEl, otherEl) {
    winEl.classList.remove("back"); winEl.classList.add("front");
    otherEl.classList.remove("front"); otherEl.classList.add("back");
  }

  var thumb = QpThumbnail.build(qp.stage);

  var summonX = 190, summonY = 105;
  var entryX = 45, entryY = 330;

  /* Hover app-bar item i and (after the real app's short delay) show its
     window thumbnail. */
  async function hoverApp(q, i, dwellMs) {
    var c = q.appBar.center(i);
    await q.cursor.move(c.x, c.y, 340);
    q.appBar.hover(i, true);
    await QuickPickHex.sleep(260); // _showThumbnailsTimer ≈ 250ms
    thumb.showFor(q.appBar.els[i], thumbData[i]);
    await QuickPickHex.sleep(dwellMs);
  }

  var steps = [
    // reset state at the top of every loop
    { fn: async function (q) {
        q.win.classList.remove("shown", "hiding");
        for (var i = 0; i < 4; i++) q.appBar.hover(i, false);
        thumb.hide();
        q.stage.classList.remove("peek");
        winBrowser.classList.remove("peeked");
        winBrowser.style.transform = "";
        focus(winEditor, winBrowser);
      } },

    // 1. cursor wanders in over the desktop
    { fn: async function (q) { q.cursor.place(entryX, entryY); await QuickPickHex.sleep(350); } },
    { cursor: "move", to: [summonX - 8, summonY - 10], ms: 550 },
    { sleep: 150 },

    // 2. hotkey press → QuickPick summons at cursor, app bar shows the
    //    running apps (underlined)
    { fn: async function (q) {
        summonX = q.cursor.x + 8; summonY = q.cursor.y + 10;
        await q.hotkey.press();
        q.window.show(summonX, summonY);
      } },
    { sleep: 650 },

    // 3. hover the editor icon → its window thumbnail appears
    { fn: async function (q) { await hoverApp(q, 0, 850); } },

    // 4. slide over to the browser icon → thumbnail swaps to that window
    { fn: async function (q) {
        q.appBar.hover(0, false);
        thumb.hide();
        await hoverApp(q, 1, 550);
      } },

    // 5. move onto the thumbnail → peek: the browser window comes forward,
    //    everything else fades (ActivatePeek)
    { fn: async function (q) {
        var c = thumb.center();
        await q.cursor.move(c.x, c.y, 300);
        thumb.hover(true);
        winBrowser.classList.add("peeked");
        q.stage.classList.add("peek");
        await QuickPickHex.sleep(850);
      } },

    // 6. click the thumbnail → switch to the browser: QuickPick hides,
    //    the browser window takes focus
    { fn: async function (q) {
        await q.cursor.click();
        thumb.hide();
        q.appBar.hover(1, false);
        q.stage.classList.remove("peek");
        winBrowser.classList.remove("peeked");
        q.window.hide();
        focus(winBrowser, winEditor);
        winBrowser.style.transform = "scale(1.04)";
        await QuickPickHex.sleep(240);
        winBrowser.style.transform = "";
      } },

    // 7. cursor drifts off; hold on the switched desktop, then loop
    { cursor: "move", to: [entryX, entryY], ms: 500 },
    { sleep: 1600 }
  ];

  QuickPickHex.runSequence(qp, steps, {
    loop: true,
    reducedMotion: async function (q) {
      q.window.show(summonX, summonY);
      q.appBar.hover(1, true);
      thumb.showFor(q.appBar.els[1], thumbData[1]);
      var c = thumb.center();
      q.cursor.place(c.x + 20, c.y - 10);
    }
  });
})();
});
</script>
</body>
</html>
