<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickPick — hex menu demo (customization)</title>
<!-- QuickPick hex-menu landing-page demo: customization.
     Shows the hex grid itself reconfiguring — command icons fly in from
     off-canvas into their hex (rather than swapping in place), a few slots
     change, the menu grows a denser outer ring, a couple more slots change,
     then the rest of the ring fills in — to sell "shape the grid around how
     you work" without simulating an actual click-through of the settings
     UI. Every hex in the final dense state shows a distinct icon. Built on
     the shared qp-core engine — see qp-core.js/qp-core.css/qp-icons.js. -->
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0d; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  /* Hexes not yet "bound" start hidden and pop in when a slot is added,
     matching the real app's behavior of leaving unconfigured indices blank. */
  .qp-hex {
    transition: opacity .4s ease-out, transform .4s cubic-bezier(.34,1.56,.64,1);
    transform-origin: 50% 50%;
  }
  .qp-hex.qp-hex-empty { opacity: 0; transform: scale(.35); }

  /* Icon clone that flies in from off-canvas into its hex, standing in for
     "this slot just became something else" without an in-place swap. */
  .qp-fly-icon {
    position: absolute;
    width: 18px; height: 18px;
    margin: -9px 0 0 -9px;
    color: #fff;
    z-index: 6;
    pointer-events: none;
  }
  .qp-fly-icon svg { width: 100%; height: 100%; display: block; }
</style>
<link rel="stylesheet" href="qp-core.css">
<link rel="stylesheet" href="qp-desktop.css">
</head>
<body>

<div class="qp-demo" id="qpDemo"></div>

<script src="qp-icons.js" defer></script>
<script src="qp-brand-icons.js" defer></script>
<script src="qp-core.js" defer></script>
<script src="qp-desktop.js" defer></script>
<script defer>
document.addEventListener("DOMContentLoaded", function () {
(function () {
  "use strict";

  /* ── Extra icons for custom-command slots, merged with the shared set.
     Every hex in the final dense (19-slot) state uses a different one of
     these — no icon repeats within a configuration. The app marks come
     from qp-brand-icons.js: recognizable power-user apps, standing in for
     the real per-app icons (StartApplicationStep auto-extracts the
     launched app's own icon); plain currentColor glyphs stand in for the
     other step types (hotkey, script, text snippet, settings). ── */
  var icons = Object.assign({}, QpIcons, QpBrandIcons, {
    /* step-type glyphs */
    hotkey:
      '<svg viewBox="0 0 24 24" fill="currentColor">' +
        '<rect x="2.5" y="6" width="19" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>' +
        '<rect x="5.5" y="9" width="2.4" height="2.4" rx=".5"/><rect x="9" y="9" width="2.4" height="2.4" rx=".5"/>' +
        '<rect x="12.5" y="9" width="2.4" height="2.4" rx=".5"/><rect x="16" y="9" width="2.4" height="2.4" rx=".5"/>' +
        '<rect x="6.5" y="13" width="11" height="2.4" rx=".5"/></svg>',
    script:
      '<svg viewBox="0 0 24 24" fill="currentColor">' +
        '<rect x="2.5" y="3.5" width="19" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>' +
        '<path d="M6 9l4 3-4 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<rect x="12.5" y="14" width="6" height="1.8" rx=".5"/></svg>',
    snippet:
      '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16v2H4zM4 9.5h16v2H4zM4 14h11v2H4z"/></svg>',
    settingsGear:
      '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3.4"/>' +
        '<path d="M12 3.6c.4 0 .8.3.8.7l.2 1.6c.6.2 1.2.4 1.7.7l1.4-.9c.4-.2.8-.1 1.1.2l1 1c.3.3.3.7.1 1.1l-.9 1.4c.3.6.5 1.1.7 1.8l1.6.2c.4.1.7.4.7.8v1.4c0 .4-.3.7-.7.8l-1.6.2c-.2.6-.4 1.2-.7 1.7l.9 1.4c.2.4.1.8-.1 1.1l-1 1c-.3.3-.7.3-1.1.1l-1.4-.9c-.6.3-1.1.5-1.7.7l-.2 1.6c-.1.4-.4.7-.8.7h-1.4c-.4 0-.7-.3-.8-.7l-.2-1.6c-.6-.2-1.2-.4-1.7-.7l-1.4.9c-.4.2-.8.1-1.1-.1l-1-1c-.3-.3-.3-.7-.1-1.1l.9-1.4c-.3-.5-.5-1.1-.7-1.7l-1.6-.2c-.4-.1-.7-.4-.7-.8v-1.4c0-.4.3-.7.7-.8l1.6-.2c.2-.7.4-1.2.7-1.8l-.9-1.4c-.2-.4-.1-.8.1-1.1l1-1c.3-.3.7-.4 1.1-.2l1.4.9c.5-.3 1.1-.5 1.7-.7l.2-1.6c.1-.4.4-.7.8-.7z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
    clipboard:
      '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="3.5" width="12" height="3" rx="1"/>' +
        '<rect x="4" y="5.5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>' +
        '<rect x="7.5" y="10" width="9" height="1.8" rx=".5"/><rect x="7.5" y="13.5" width="9" height="1.8" rx=".5"/>' +
        '<rect x="7.5" y="17" width="6" height="1.8" rx=".5"/></svg>'
  });

  /* ── Center + ring 1 (default 7) + ring 2 (12 more, start empty) ── */
  var DEFAULT_BINDINGS = ["tools", "minimize", "forward", "play", "backward", "volume", "adjust"];
  var RING2_CELLS = [
    { c: -2, r: 0 }, { c: -1, r: -1 }, { c: 0, r: -2 }, { c: 1, r: -2 }, { c: 2, r: -2 }, { c: 2, r: -1 },
    { c: 2, r: 0 },  { c: 1, r: 1 },   { c: 0, r: 2 },   { c: -1, r: 2 }, { c: -2, r: 2 },  { c: -2, r: 1 }
  ];
  var cells = [
    { c: 0, r: 0 }, { c: 1, r: -1 }, { c: 1, r: 0 }, { c: 0, r: 1 }, { c: -1, r: 1 }, { c: -1, r: 0 }, { c: 0, r: -1 }
  ].concat(RING2_CELLS);
  var RING2_START = 7; // index of the first ring-2 slot

  var qp = QuickPickHex.create(document.getElementById("qpDemo"), {
    cells: cells,
    bindings: DEFAULT_BINDINGS, // ring-2 slots (7-18) render with no icon until "added"
    icons: icons,
    stageWidth: 380,
    stageHeight: 370
  });

  QpDesktop.build(qp, {
    shortcuts: [
      { icon: "recycleBin", label: "Recycle Bin" },
      { icon: "abletonLive", label: "Ableton Live" }
    ],
    taskbar: [
      "fileExplorer",
      { icon: "chrome", run: true },
      { icon: "vsCode", run: true },
      "msTeams", "outlook", "spotify"
    ]
  });

  var hexEls = Array.from(qp.win.querySelectorAll(".qp-hex"));

  function hideRingSlot(i) { hexEls[i].classList.add("qp-hex-empty"); }
  function showRingSlot(i) { hexEls[i].classList.remove("qp-hex-empty"); }

  /* Fly a clone of `iconName` in from off-canvas into hex `i`'s position;
     right as it arrives, the real hex takes on that icon (and, for a
     previously-empty ring-2 slot, pops into existence) while the clone is
     removed — reads as "this became something else" / "a new slot showed
     up", not an in-place icon replacement. */
  function flyIn(q, i, iconName, opts) {
    opts = opts || {};
    var target = q.hex.center(i);
    var stageW = q.stage.offsetWidth || 380;
    var startX = target.x < stageW / 2 ? -30 : stageW + 30;

    var el = document.createElement("div");
    el.className = "qp-fly-icon";
    el.innerHTML = icons[iconName] || "";
    el.style.left = startX + "px";
    el.style.top = target.y + "px";
    el.style.opacity = "0";
    el.style.transform = "scale(.5)";
    q.stage.appendChild(el);
    void el.offsetWidth; // force reflow so the transition below animates
    el.style.transition = "left .48s cubic-bezier(.22,.85,.3,1), opacity .3s ease-out, transform .48s cubic-bezier(.34,1.56,.64,1)";
    el.style.left = target.x + "px";
    el.style.opacity = "1";
    el.style.transform = "scale(1)";

    return QuickPickHex.sleep(440).then(function () {
      if (opts.reveal) showRingSlot(i);
      q.hex.setIcon(i, iconName);
      q.hex.hover(i, true);
      el.remove();
      return QuickPickHex.sleep(160).then(function () { q.hex.hover(i, false); });
    });
  }

  var summonX = 190, summonY = 105;
  var entryX = 45, entryY = 330;

  var steps = [
    // reset state at the top of every loop (menu is hidden while this runs)
    { fn: async function (q) {
        q.win.classList.remove("shown", "hiding");
        q.stage.querySelectorAll(".qp-fly-icon").forEach(function (el) { el.remove(); });
        for (var i = 0; i < DEFAULT_BINDINGS.length; i++) q.hex.hover(i, false);
        q.hex.setIcon(1, "minimize"); q.hex.setIcon(2, "forward"); q.hex.setIcon(3, "play");
        q.hex.setIcon(4, "backward"); q.hex.setIcon(5, "volume"); q.hex.setIcon(6, "adjust");
        for (var r = RING2_START; r < cells.length; r++) { hideRingSlot(r); q.hex.hover(r, false); q.hex.setIcon(r, ""); }
      } },

    // 1. cursor wanders in
    { fn: async function (q) { q.cursor.place(entryX, entryY); await QuickPickHex.sleep(300); } },
    { cursor: "move", to: [summonX - 8, summonY - 10], ms: 550 },
    { sleep: 150 },

    // 2. hotkey press → summon the default menu, let it register
    { fn: async function (q) {
        summonX = q.cursor.x + 8; summonY = q.cursor.y + 10;
        await q.hotkey.press();
        q.window.show(summonX, summonY);
      } },
    { sleep: 700 },

    // 3. a few hexes become custom commands — new icons fly in, not swapped in place
    { fn: async function (q) {
        await flyIn(q, 2, "visualStudio");
        await QuickPickHex.sleep(200);
        await flyIn(q, 4, "hotkey");
        await QuickPickHex.sleep(200);
        await flyIn(q, 6, "script");
        await QuickPickHex.sleep(500);
      } },

    // 4. a few hexes appear on the outer ring
    { fn: async function (q) {
        await flyIn(q, 9, "photoshop", { reveal: true });
        await QuickPickHex.sleep(160);
        await flyIn(q, 10, "msTeams", { reveal: true });
        await QuickPickHex.sleep(160);
        await flyIn(q, 13, "outlook", { reveal: true });
        await QuickPickHex.sleep(500);
      } },

    // 5. a couple more change
    { fn: async function (q) {
        await flyIn(q, 1, "windowsTerminal");
        await QuickPickHex.sleep(200);
        await flyIn(q, 3, "snippet");
        await QuickPickHex.sleep(500);
      } },

    // 6. the rest of the outer ring fills in — full 19-hex "power user" menu,
    //    every hex showing a distinct icon; flights overlap for a cascade
    { fn: async function (q) {
        var rest = [
          [7, "abletonLive"], [8, "slack"], [11, "chrome"], [12, "notion"],
          [14, "excel"], [15, "obsStudio"], [16, "fileExplorer"], [17, "settingsGear"], [18, "clipboard"]
        ];
        var last;
        for (var i = 0; i < rest.length; i++) {
          last = flyIn(q, rest[i][0], rest[i][1], { reveal: true });
          await QuickPickHex.sleep(90);
        }
        await last;
        await QuickPickHex.sleep(500);
      } },

    // 7. hold the full, dense menu so it registers
    { sleep: 1100 },

    // 8. cursor drifts off, click outside → menu hides, loop resets
    { fn: async function (q) {
        await q.cursor.move(entryX, entryY, 450);
        await q.cursor.click();
        q.window.hide();
      } },
    { sleep: 900 }
  ];

  QuickPickHex.runSequence(qp, steps, {
    loop: true,
    reducedMotion: async function (q) {
      q.hex.setIcon(1, "windowsTerminal"); q.hex.setIcon(2, "visualStudio"); q.hex.setIcon(3, "snippet");
      q.hex.setIcon(4, "hotkey"); q.hex.setIcon(6, "script");
      var full = [
        [7, "abletonLive"], [8, "slack"], [9, "photoshop"], [10, "msTeams"], [11, "chrome"],
        [12, "notion"], [13, "outlook"], [14, "excel"], [15, "obsStudio"],
        [16, "fileExplorer"], [17, "settingsGear"], [18, "clipboard"]
      ];
      full.forEach(function (pair) { q.hex.setIcon(pair[0], pair[1]); showRingSlot(pair[0]); });
      q.window.show(summonX, summonY);
      q.cursor.place(entryX, entryY);
    }
  });
})();
});
</script>
</body>
</html>
