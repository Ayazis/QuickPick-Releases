<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flat-Top Honeycomb</title>
<style>
  body {
    background: #1a1a1a;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .grid {
    position: relative;
  }

  .hex {
    position: absolute;
    width: 100px;
    height: 86.6px;
    cursor: pointer;
  }

  svg {
    width: 100%;
    height: 100%;
  }

  polygon {
    fill: #2b2b2b;
    stroke: #00ffff;
    stroke-width: 2;
    transition: 0.2s;
  }

  text {
    fill: #00ffff;
    font-size: 14px;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
    font-family: sans-serif;
  }

  .hex:hover polygon {
    fill: #00ffff;
  }

  .hex:hover text {
    fill: #1a1a1a;
  }

  .hex:active polygon {
    transform: scale(0.95);
    transform-origin: center;
    fill: #00cccc;
  }
</style>
</head>
<body>

<div class="grid" id="grid"></div>

<script>
const grid = document.getElementById("grid");

const cols = 6;
const rows = 5;

const size = 100;
const hexHeight = Math.sqrt(3) * size / 2; // correct flat-top height
const horiz = size * 0.75; // horizontal spacing
const vert = hexHeight;    // vertical spacing

function createHex(x, y, label) {
  const div = document.createElement("div");
  div.className = "hex";
  div.style.left = x + "px";
  div.style.top = y + "px";

  div.innerHTML = `
    <svg viewBox="0 0 100 86.6">
      <polygon points="
        25,0
        75,0
        100,43.3
        75,86.6
        25,86.6
        0,43.3
      "/>
      <text x="50" y="43.3">${label}</text>
    </svg>
  `;

  div.onclick = () => alert("Clicked " + label);

  return div;
}

for (let r = 0; r < rows; r++) {
  for (let c = 0; c < cols; c++) {

    const x = c * horiz;
    const y = r * vert + (c % 2 ? vert / 2 : 0);

    grid.appendChild(createHex(x, y, `${r},${c}`));
  }
}

grid.style.width = (cols * horiz + size * 0.25) + "px";
grid.style.height = (rows * vert + vert / 2) + "px";
</script>

</body>
</html>
