<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickPick — hex menu demo (basic functionality)</title>
<!-- QuickPick hex-menu landing-page demo: basic functionality
     (volume, playback, brightness). Built on the shared qp-core engine —
     see qp-core.js/qp-core.css/qp-icons.js. To embed, copy this file's
     .qp-demo block together with those shared files. -->
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0d; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  /* Step caption — names the control the sequence is demonstrating right
     now. Sits below the menu, and lives in the panel rather than the
     stage, so the camera's zoom doesn't scale it. */
  .qp-caption {
    position: absolute;
    top: 50%; left: 50%;
    transform: translateX(-50%);
    z-index: 8;
    display: flex; align-items: center; gap: 7px;
    padding: 5px 12px 5px 6px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px;
    background: rgba(12, 14, 20, .72);
    backdrop-filter: blur(10px);
    color: #eaf2ff;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: .01em;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .35s ease-out, transform .35s ease-out;
    pointer-events: none;
  }
  .qp-caption.shown { opacity: 1; }
  .qp-caption-step {
    display: flex; align-items: center; justify-content: center;
    width: 17px; height: 17px;
    border-radius: 50%;
    background: #29d3e0;
    color: #06232b;
    font-size: 9.5px; font-weight: 700;
  }
</style>
<link rel="stylesheet" href="qp-core.css">
<link rel="stylesheet" href="qp-desktop.css">
</head>
<body>

<div class="qp-demo" id="qpDemo"></div>

<script src="qp-icons.js" defer></script>
<script src="qp-brand-icons.js" defer></script>
<script src="qp-core.js" defer></script>
<script src="qp-desktop.js" defer></script>
<script defer>
document.addEventListener("DOMContentLoaded", function () {
(function () {
  "use strict";

  var bindings = ["tools", "minimize", "forward", "play", "backward", "volume", "adjust"];

  /* The demo opens on the whole desktop — QuickPick summons at its real,
     small size — then the camera pushes in on the menu for the rest of the
     sequence. The world is 2x the visible frame, so OVERVIEW_ZOOM 0.5 fits
     all of it and CLOSEUP_ZOOM 1 frames the menu. */
  var WORLD = { width: 760, height: 740 };
  var OVERVIEW = { x: 380, y: 370, zoom: 0.5 };
  var CLOSEUP_ZOOM = 1;
  // The close shot sits a little below the summon point, so the menu keeps
  // its original place in the upper half of the frame and whatever hangs
  // under it (app bar, thumbnails) still fits.
  var CLOSEUP_DROP = 80;

  var qp = QuickPickHex.create(document.getElementById("qpDemo"), {
    bindings: bindings,
    icons: QpIcons,
    stageWidth: 380,  // matches the app-switch demo's canvas so both carousel slides are the same size
    stageHeight: 370,
    world: WORLD,
    camera: OVERVIEW
  });

  /* Windows desktop backdrop — the brightness step below filters the whole
     demo root, so the wallpaper dims and un-dims along with everything else. */
  QpDesktop.build(qp, {
    shortcuts: [
      { icon: "recycleBin", label: "Recycle Bin" },
      { icon: "abletonLive", label: "Ableton Live" }
    ],
    taskbar: [
      "fileExplorer",
      { icon: "chrome", run: true },
      { icon: "vsCode", run: true },
      "msTeams", "outlook", "spotify"
    ]
  });

  /* ── Step caption ──
     The sequence demonstrates three system controls in order; this names
     each one as it happens. Sits in the panel, above the stage, so it
     stays legible whatever the camera is doing. */
  var captionEl = document.createElement("div");
  captionEl.className = "qp-caption";
  qp.root.appendChild(captionEl);

  var STEPS = ["Windows volume", "Monitor brightness", "Music playback"];

  // Show step `n` (1-based); caption(0) hides it. Fades out before swapping
  // the text so the two labels never cross-fade into each other.
  async function caption(n) {
    if (!n) {
      captionEl.classList.remove("shown");
      return QuickPickHex.sleep(350);
    }
    if (captionEl.classList.contains("shown")) {
      captionEl.classList.remove("shown");
      await QuickPickHex.sleep(300);
    }
    captionEl.innerHTML = '<span class="qp-caption-step">' + n + "</span>" +
      "<span>" + STEPS[n - 1] + "</span>";
    captionEl.classList.add("shown");
    return QuickPickHex.sleep(220);
  }

  // World coordinates (the frame's old 380x370 box now sits in the middle
  // of the 760x740 desktop, so these are the old points + (190, 185)).
  var summonX = 380, summonY = 290; // default summon point (used by reduced-motion fallback) — matches the app-switch demo's summon point
  var entryX = 235, entryY = 515;   // where the cursor wanders in from, and returns to on exit — matches the app-switch demo

  // Drag a hex's value gauge along a path of percentages (e.g. [40,78] for a
  // one-way drag, or [72,30,72] for a drag-down-then-back-up), nudging the
  // cursor up/down alongside it. onFrame(pct), if given, fires on every
  // eased step so callers can sync other effects (e.g. screen brightness)
  // with the drag — including its reverse leg. Shared by the volume and
  // brightness steps.
  async function dragGauge(q, hexIndex, path, onFrame) {
    var center = q.hex.center(hexIndex);
    await q.cursor.move(center.x, center.y, 350);
    q.hex.hover(hexIndex, true);
    await QuickPickHex.sleep(220);
    await q.cursor.click();

    var dragSteps = 16;
    q.hex.setGauge(hexIndex, path[0]);
    if (onFrame) onFrame(path[0]);
    for (var seg = 0; seg < path.length - 1; seg++) {
      var startPct = path[seg], endPct = path[seg + 1];
      for (var s = 1; s <= dragSteps; s++) {
        var t = s / dragSteps;
        var e = 1 - Math.pow(1 - t, 2); // ease-out
        var pct = startPct + (endPct - startPct) * e;
        q.hex.setGauge(hexIndex, Math.round(pct));
        if (onFrame) onFrame(pct);
        q.cursor.moveInstant(center.x, center.y - 26 * (endPct > startPct ? e : -e));
        await QuickPickHex.sleep(25);
      }
      await QuickPickHex.sleep(150);
    }
    q.hex.clearGauge(hexIndex); // release
    await QuickPickHex.sleep(120);
    q.hex.hover(hexIndex, false);
  }

  var steps = [
    // reset state at the top of every loop
    { fn: async function (q) {
        q.win.classList.remove("shown", "hiding");
        for (var i = 0; i < bindings.length; i++) { q.hex.hover(i, false); q.hex.clearGauge(i); }
        q.hex.setIcon(3, "play");
        q.root.style.transition = "";
        q.root.style.filter = "";
        captionEl.classList.remove("shown");
        q.camera.to(OVERVIEW.x, OVERVIEW.y, OVERVIEW.zoom); // back to the wide shot
      } },

    // 1. cursor wanders in across the desktop
    { fn: async function (q) { q.cursor.place(entryX, entryY); await QuickPickHex.sleep(300); } },
    { cursor: "move", to: [summonX - 8, summonY - 10], ms: 650 },
    { sleep: 150 },

    // 2. hotkey press → summon at cursor, at its real size on the desktop
    { fn: async function (q) {
        summonX = q.cursor.x + 8; summonY = q.cursor.y + 10;
        await q.hotkey.press();
        q.window.show(summonX, summonY);
      } },
    { sleep: 700 },

    // 3. push in on the menu — the cursor scales with the scene
    { fn: async function (q) { await q.camera.to(summonX, summonY + CLOSEUP_DROP, CLOSEUP_ZOOM, 900); } },
    { sleep: 250 },

    // 4. hover volume hex, drag up → cyan gauge fills
    { fn: async function (q) {
        await caption(1);
        await dragGauge(q, 5, [40, 78]);
      } },

    // 5. hover brightness hex, drag down then back up → the whole scene
    //    dims and un-dims in lockstep with the reversing gauge/cursor
    { fn: async function (q) {
        await caption(2);
        await dragGauge(q, 6, [100, 30, 100], function (pct) {
          q.root.style.filter = "brightness(" + (pct / 100).toFixed(2) + ")";
        });
        q.root.style.filter = ""; // fully normal once the interaction ends
      } },

    // 6. click play/pause → icon toggles
    { fn: async function (q) {
        await caption(3);
        var pp = q.hex.center(3);
        await q.cursor.move(pp.x, pp.y, 320);
        q.hex.hover(3, true);
        await QuickPickHex.sleep(180);
        await q.cursor.click();
        q.hex.setIcon(3, "pause");
        await QuickPickHex.sleep(400);
        q.hex.hover(3, false);
      } },

    // 7. pull back out while the cursor drifts off, click outside → menu hides
    { fn: async function (q) {
        await caption(0);
        await Promise.all([
          q.camera.to(OVERVIEW.x, OVERVIEW.y, OVERVIEW.zoom, 700),
          q.cursor.move(entryX, entryY, 700)
        ]);
        await q.cursor.click();
        q.window.hide();
      } },
    { sleep: 900 }
  ];

  QuickPickHex.runSequence(qp, steps, {
    loop: true,
    reducedMotion: async function (q) {
      // nothing animates, so name all three controls at once
      captionEl.innerHTML = "<span>" + STEPS.join(" · ") + "</span>";
      captionEl.classList.add("shown");
      q.camera.to(summonX, summonY + CLOSEUP_DROP, CLOSEUP_ZOOM); // no camera move: hold the close shot
      q.cursor.place(summonX + 4, summonY + 6);
      q.window.show(summonX, summonY);
    }
  });
})();
});
</script>
</body>
</html>
