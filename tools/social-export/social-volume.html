<!doctype html>
<html lang="en"><meta charset="utf-8"><title>QuickPick — Stay in your flow</title>
<link rel="stylesheet" href="../../assets/demos/qp-core.css">
<link rel="stylesheet" href="../../assets/demos/qp-desktop.css">
<link rel="stylesheet" href="../../assets/demos/qp-window.css">
<style>
*{box-sizing:border-box;animation:none!important;transition:none!important}
body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#090f19;color:#f3f7fc;font-family:'Segoe UI',sans-serif}
body:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 48%,#163947,transparent 65%)}
.brand{position:absolute;left:84px;top:145px;font-size:34px;font-weight:700;letter-spacing:1px;color:#55dfdc}
.platform{position:absolute;right:150px;top:155px;font-size:23px;color:#9aaabe}
.copy{position:absolute;left:84px;top:260px;width:810px}
h1{font-size:98px;line-height:1.01;letter-spacing:-4px;margin:0 0 28px;max-width:810px}
.sub{font-size:35px;line-height:1.35;color:#b8c9d9;max-width:790px;min-height:95px}
.screen{position:absolute;left:64px;top:610px;width:900px;height:877px;overflow:hidden;border:2px solid #355061;border-radius:30px;box-shadow:0 24px 70px #0007}
.scene{width:380px;height:370px;transform:scale(2.368421);transform-origin:0 0}
.qp-hotkey{display:none!important}
.work-window{background:#171f2b;border:1px solid #536575;border-radius:10px;overflow:hidden;box-shadow:0 14px 45px #0006}
.paper{padding:28px 32px;color:#dfebf2}.paper small{font-size:13px;letter-spacing:3px;color:#6fcecf}.paper h2{font-size:34px;line-height:1.15;margin:15px 0}.paper p{font-size:22px;line-height:1.55;color:#b6c5d6}.paper .typed{color:#e1f3f2}.paper .caret{border-right:2px solid #58d8d2;padding-right:3px}
.volume{position:absolute;left:105px;bottom:32px;width:690px;padding:20px 28px;background:#101a28ed;border:1px solid #456070;border-radius:18px;font-size:25px;display:flex;align-items:center;gap:20px;box-shadow:0 10px 30px #0005}
.volume svg{width:32px;height:32px}.track{height:8px;border-radius:8px;background:#3b4b5c;flex:1;overflow:hidden}.fill{height:100%;background:#fb947c}.percent{font-size:28px;font-weight:700;width:70px;text-align:right}
.prompt{position:absolute;left:84px;right:160px;top:1530px;font-size:32px;text-align:center;color:#d9e6f0;min-height:100px}
kbd{display:inline-block;padding:9px 19px;border:1px solid #64818d;border-bottom-width:4px;border-radius:10px;background:#192a38;font-family:inherit;font-size:31px}.helper{font-size:22px;color:#95aabc;margin-top:13px}
.disclaimer{position:absolute;left:84px;bottom:220px;font-size:20px;color:#8399af;letter-spacing:.4px}
.closing{position:absolute;inset:0;background:radial-gradient(ellipse at 45% 40%,#143745,#090f19 75%);padding:490px 84px 0;opacity:0;pointer-events:none}
.closing .mark{font-size:45px;color:#55dfdc;font-weight:700;margin-bottom:45px}.closing h2{font-size:110px;line-height:1.02;letter-spacing:-5px;max-width:790px;margin:0 0 40px}.closing p{font-size:37px;line-height:1.4;color:#b8cad8;max-width:760px}.button{display:inline-block;margin-top:40px;padding:25px 36px;background:#54ded7;border-radius:16px;font-size:34px;font-weight:700;color:#08202b}.url{margin-top:40px;font-size:35px;color:#e5f9ff;letter-spacing:1px}
</style>
<div class="brand">⬡ QuickPick</div><div class="platform">FOR WINDOWS 11</div>
<div class="copy"><h1></h1><div class="sub"></div></div>
<div class="screen"><div class="scene"><div id="demo"></div></div><div class="volume"><span id="speaker"></span><span>Volume</span><div class="track"><div class="fill"></div></div><span class="percent"></span></div></div>
<div class="prompt"></div><div class="disclaimer">Illustrated demo · Interface may vary</div>
<div class="closing"><div class="mark">⬡ QuickPick</div><h2>Stay in<br>your flow.</h2><p>Your Windows apps and controls.<br>Right at your cursor.</p><div class="button">Get QuickPick for Windows 11 ↗</div><div class="url">quick-pick.app</div></div>
<script src="../../assets/demos/qp-icons.js"></script><script src="../../assets/demos/qp-brand-icons.js"></script><script src="../../assets/demos/qp-core.js"></script><script src="../../assets/demos/qp-desktop.js"></script><script src="../../assets/demos/qp-window.js"></script>
<script>
const q=QuickPickHex.create(document.querySelector('#demo'),{bindings:['tools','minimize','forward','play','backward','volume','adjust'],icons:QpIcons,stageWidth:380,stageHeight:370,world:{width:760,height:740},camera:{x:380,y:370,zoom:.5}});
QpDesktop.build(q,{shortcuts:[],taskbar:['fileExplorer',{icon:'chrome',run:true},'spotify']});
QpWindow.build(q,{className:'work-window',icon:QpIcons.tools,title:'Notes — Launch plan',at:{left:105,top:155,width:550,height:425},bodyHTML:'<div class="paper"><small>WORK IN PROGRESS</small><h2>A good idea,<br>in progress.</h2><p>Make something useful.<br>Keep the message simple.</p><p class="typed"><span></span><span class="caret"></span></p></div>'});
document.querySelector('#speaker').innerHTML=QpIcons.volume;
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const mix=(a,b,p)=>a+(b-a)*p;
q.win.style.left='380px';q.win.style.top='300px';
const volumeCenter=q.hex.center(5);
const chapters=[
 {at:0,title:'Music too loud?',sub:'Stay where you’re working.'},
 {at:2,title:'Keep your focus.',sub:'QuickPick brings Windows controls to your cursor.'},
 {at:4.3,title:'One shortcut.',sub:'Your controls appear right here.'},
 {at:6.1,title:'Turn it down.',sub:'Adjust the volume from the menu.'},
 {at:8.3,title:'That’s better.',sub:'Volume down. Focus intact.'},
 {at:11.5,title:'Stay in your flow.',sub:'Back to your idea. Without the detour.'}
];
// A seekable storyboard: all visuals derive from one timestamp, with no timers.
window.renderAd=t=>{
 const chapter=chapters.filter(c=>c.at<=t).at(-1);
 document.querySelector('h1').textContent=chapter.title;
 document.querySelector('.sub').textContent=chapter.sub;
 const enter=ease((t-chapter.at)/.18);
 document.querySelector('.copy').style.transform=`translateY(${(1-enter)*12}px)`;
 document.querySelector('.copy').style.opacity=.65+.35*enter;
 const zoom=ease((t-3.7)/.65)*(1-ease((t-9.1)/.6));
 q.camera.to(380,370,mix(.5,1.08,zoom));
 document.querySelector('.work-window').style.opacity=1-.72*zoom;
 document.querySelector('.work-window').style.filter=`blur(${zoom}px)`;
 q.win.style.left='380px';q.win.style.top='300px';
 const show=ease((t-3.15)/.2)*(1-ease((t-8.8)/.15));
 q.win.style.opacity=show;q.win.style.transform=`scale(${mix(.86,1,show)})`;
 let x=385,y=465;
 const approach=ease((t-2.55)/.4); x=mix(x,380,approach);y=mix(y,300,approach);
 const aim=ease((t-5.45)/.28);x=mix(x,volumeCenter.x,aim);y=mix(y,volumeCenter.y,aim);
 const drag=ease((t-6.5)/.8);
 const volume=Math.round(mix(82,28,drag));
 y+=26*drag;
 const leave=ease((t-9.1)/.45);x=mix(x,385,leave);y=mix(y,465,leave);
 q.cursor.place(x,y);
 q.hex.hover(5,t>=5.73&&t<8.8);
 q.hex.clearGauge(5);
 if(t>=6.5&&t<8.8)q.hex.setGauge(5,volume);
 const ripple=q.root.querySelector('.qp-ripple');
 const pulse=clamp((t-6.25)/.22);
 ripple.style.opacity=t>=6.25&&t<6.47?1-pulse:0;
 ripple.style.transform=`scale(${mix(.3,1.3,pulse)})`;
 document.querySelector('.fill').style.width=volume+'%';
 document.querySelector('.fill').style.background=t<7.3?'#fb947c':'#55dfdc';
 document.querySelector('.percent').textContent=volume+'%';
 document.querySelector('.prompt').innerHTML=t<2?'Keep the idea. Lose the interruption.':t<5.45?'<kbd>Ctrl</kbd> + <kbd>Space</kbd><div class="helper">Example shortcut · Make it your own</div>':t<8.3?'Volume, right at your cursor.':t<11.5?'Same app. Same train of thought.':'Less interruption. More flow.';
 document.querySelector('.typed span').textContent='Make room for your next idea.'.slice(0,Math.floor(clamp((t-10)/1.3)*29));
 document.querySelector('.closing').style.opacity=ease((t-14.7)/.3);
 window.adState={time:t,volume,cursorX:x,cursorY:y,drag,show};
};
window.renderAd(0);
if(!location.search.includes('export')){const start=performance.now();function preview(now){renderAd(((now-start)/1000)%18);requestAnimationFrame(preview)}requestAnimationFrame(preview)}
</script></html>
